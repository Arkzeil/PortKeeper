name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizers: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc clang iproute2 python3
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DPORTKEEPER_ASAN=${{ matrix.sanitizers }}
          -DPORTKEEPER_UBSAN=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Check different-user ownership refusal
        if: matrix.sanitizers == 'OFF'
        run: sudo /usr/bin/python3 tests/integration.py "$PWD/build/portkeeper" Integration.test_cross_user_owner
